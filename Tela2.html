<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobotomy</title>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            background-color: #2b0752;
            min-height: 100vh;


            display: flex;
            align-items: center;
            justify-content: center;


            font-family: Arial, sans-serif;
        }


        .container {
            width: 850px;


            display: flex;
            gap: 35px;


            justify-content: center;
            align-items: center;
        }


        .screen {
            width: 240px;
            height: 400px;


            background-color: #7519b8;


            display: flex;
            flex-direction: column;
            align-items: center;


            padding-top: 55px;
        }


        .center {
            background-color: #6510a3;
        }


        h1 {
            color: white;
            font-size: 22px;
            margin-bottom: 8px;
        }


        .subtitulo {
            color: white;
            font-size: 12px;
            margin-bottom: 25px;
        }


        .form {
            width: 80%;
        }


        input {
            width: 100%;
            height: 35px;


            border: 1px solid #aaa;
            border-radius: 20px;


            padding: 0 12px;
            margin-bottom: 12px;


            outline: none;
        }


        .lembrar {
            color: white;
            font-size: 10px;


            display: flex;
            align-items: center;


            margin-bottom: 15px;
        }


        .lembrar input {
            width: 10px;
            height: 10px;
            margin: 0 5px 0 0;
        }


        button {
            width: 100%;
            height: 35px;


            border: none;
            border-radius: 20px;


            background-color: white;
            color: #6510a3;


            cursor: pointer;


            font-size: 12px;
        }


        .center h1 {
            font-size: 24px;
            margin-top: 5px;
        }


        .center .subtitulo {
            letter-spacing: 2px;
            font-size: 9px;
        }


        .botoes {
            width: 80%;
            margin-top: 20px;
        }


        .botoes button {
            margin-bottom: 12px;
        }


        @media (max-width: 900px) {


            .container {
                width: 100%;
                flex-direction: column;
                gap: 20px;
            }


        }
    </style>
</head>


<body>


    <div class="container">


        <div class="screen">


            <h1>Login</h1>


            <p class="subtitulo">
                Entre na sua conta
            </p>


            <div class="form">


                <input type="text" placeholder="User Name">


                <input type="password" placeholder="Password">


                <label class="lembrar">
                    <input type="checkbox">
                    Lembrar senha
                </label>


                <button>
                    Sign in
                </button>


            </div>


        </div>


        <div class="screen center">


            <h1>Lobotomy</h1>


            <p class="subtitulo">
                Company
            </p>


            <div class="botoes">


                <button>
                    Sign in
                </button>


                <button>
                    Sign up
                </button>


            </div>


        </div>




        <div class="screen">


            <h1>Sign up</h1>


            <p class="subtitulo">
                Crie sua conta
            </p>


            <div class="form">


                <input type="text" placeholder="User Name">


                <input type="email" placeholder="E-mail">


                <input type="password" placeholder="Password">


                <label class="lembrar">
                    <input type="checkbox">
                    Aceito os termos
                </label>


                <button>
                    Sign up
                </button>


            </div>


        </div>


    </div>


</body>


</html>
